
name: HealOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t healops:${{ github.sha }} .

      - name: Start HealOps container
        run: docker run -d --name healops-test -p 8000:8000 healops:${{ github.sha }}

      - name: Test health endpoint
        run: |
          for i in $(seq 1 15); do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs healops-test
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f healops-test || true
